[project]
name = "env-tool"
version = "0.2.0"
description = "Cluster-aware env file management for DGX Spark model recipes"
requires-python = ">=3.9"

[project.scripts]
env-tool = "env_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["env_tool"]
