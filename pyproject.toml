[project]
name = "env-tool"
version = "0.1.0"
description = "Merge a local .env file into an example .env file"
requires-python = ">=3.9"

[project.scripts]
env-tool = "env_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["env_tool"]
